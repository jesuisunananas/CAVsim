    enabled: true
    json_path: output/multi_cam_detections.json
    video_path: null
  upload:
    enabled: false
    endpoint: https://w0j9m7dgpg.execute-api.us-west-1.amazonaws.com/detections
  broadcast:
    enabled: true
    socket_path: /tmp/coperception_output.sock
