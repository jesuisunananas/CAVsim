# Per-machine pipeline configuration. Everything that used to be hardcoded
# in scripts/process_video.py's __main__ block lives here instead, so the
# same code runs unmodified on a different machine (e.g. the Orin edge
# deployment) by pointing it at a different copy of this file --
# see src/co_perception/config.py for the loader and README.md for the
# full schema reference.

show_live: false

ingestion:
  # local_socket: subscribe to camera/stream's decode-stage broadcast
  #   (already-decoded frames + calibrated abs_time) over a Unix socket --
  #   only valid on a machine that's also running that pipeline.
  # local_file:   read a video file from disk (path).
  # aws_kvs:      pull an HLS stream from AWS Kinesis Video Streams (stream name).
  mode: gpu_decode
  # The camera's real source rate -- used only to size the cross-channel
  # timestamp-alignment tolerance (live sources only, see process_video.py).
  nominal_fps: 30
  # How often to actually run detection. Downsampling happens here, after
  # decode -- never before it (pre-decode frame-skipping breaks H.264
  # P/B-frame references). Must be <= nominal_fps; config.py raises if not.
  target_fps: 10
  # Per-channel history buffer for cross-channel alignment, in seconds (see
  # ingest/frame_sources.py's LocalSocketSource). Sized to comfortably
  # exceed decode's own worst-case backlog (bounded to ~3s by its GOP-aware
  # drop, see camera/stream/decode/main.py). Memory cost is real: at this
  # camera's resolution, roughly (seconds * nominal_fps * ~14MB * 4 channels)
  # worst-case -- 8s is ~13GB worst-case, only reached under sustained
  # misalignment, not steady-state operation.
  sync_buffer_seconds: 4
  # gpu_decode only: GpuDecodeSource buffers every decoded frame (no
  # decimation), letterboxed to the inference resolution before buffering
  # (see ingest/gpu_decode_source.py), so this is purely an OOM guard
  # against a channel getting ahead of consumption -- 3s * 30fps *
  # ~3.69MB/frame * 4 channels ~= 1.3GB worst-case (all 4 buffers
  # simultaneously full), not the expected steady-state size (the sync
  # loop prunes every tick). Worth watching against the free VRAM budget
  # with Carla resident if this ever needs raising -- not a tuning knob
  # otherwise.
  max_buffer_ahead_sec: 3.0
  # How many consecutive ticks one channel may miss before the sync loop
  # halts, waits for all four to be stable again, and re-locks the basis,
  # rather than continuing to skip ticks indefinitely.
  max_consecutive_skips: 5
  # Jitter-buffer margin: how far basis_0 is locked behind the freshest
  # jointly-available timestamp at (re)lock time. Was hardcoded to
  # 1/target_fps (100ms) before -- too tight to survive real delivery
  # bursts (measured ~240-290ms recurring gaps on one channel this
  # session). See config.py's validation/comment for the full rationale.
  sync_margin_sec: 1.0
  channels:
    # gpu_decode mode: these point at demux's broadcast (compressed H.264),
    # not decode's -- GpuDecodeSource does its own NVDEC decode from here.
    # Same socket_path field local_socket mode uses, different meaning --
    # see ingest/gpu_decode_source.py and config.py's validation.
    - channel: 0
      socket_path: /tmp/camera_demux_ch0.sock
    - channel: 1
      socket_path: /tmp/camera_demux_ch1.sock
    - channel: 2
      socket_path: /tmp/camera_demux_ch2.sock
    - channel: 3
      socket_path: /tmp/camera_demux_ch3.sock

detection:
  model_path: models/yolov8n.pt
  conf: 0.5
  # YOLO inference resolution (the side model.track() letterboxes the
  # longest edge to). Left unset anywhere in the repo, Ultralytics
  # defaults to 640 -- which letterboxes this camera's 2560x1920 frames
  # down to 640x480 and makes vehicles beyond ~100m undetectable. At
  # 1280 on these 4:3 frames, letterbox output is 1280x960. Tunable
  # without a code change: drop to 960 here if throughput doesn't hold
  # at 1280 (see Commit 2 report).
  imgsz: 1280
  cameras:
    - channel: 0
      device_id: cam-001-ch1
      K: [[1325.4, 0, 1280.0], [0, 1325.4, 960.0], [0, 0, 1]]
      camera_height: 7.0
      pitch_deg: -39.20
